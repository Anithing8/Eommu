<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eommu</title><meta name="description" content="Eommu, a quiet task tracker.">
<meta name="theme-color" content="#e3dfd7"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css"></head><body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
<header><h1>Eommu</h1><div class="hd"><button id="bell" class="btn raised" aria-label="Enable reminders">🔔</button><button id="opts" class="btn raised" aria-label="List options">⋯</button></div></header>
<nav id="tabs" aria-label="Lists"></nav>
<form id="add"><input id="new" class="inset" placeholder="Add a task" autocomplete="off" maxlength="200" aria-label="New task"><button class="btn raised acc" aria-label="Add">+</button></form>
<div class="bar"><button id="sort" class="pill raised"></button><button id="yday" class="pill raised">Copy yesterday</button><button id="clr" class="pill raised">Clear done</button></div>
<ul id="list"></ul>
<details id="dn"><summary>Completed <span id="dc"></span></summary><ul id="done"></ul></details>
</main>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="app.js"></script></body></html>
